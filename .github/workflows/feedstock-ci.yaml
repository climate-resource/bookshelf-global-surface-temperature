name: Feedstock CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bookshelf:
    name: Bookshelf
    uses: climate-resource/copier-bookshelf-dataset/.github/workflows/feedstock-ci.yaml@v0.7.0
    with:
      recipes: >-
        bookshelf.yaml
      main-ref: main
      api-base-url: ${{ vars.BOOKSHELF_API_URL }}
