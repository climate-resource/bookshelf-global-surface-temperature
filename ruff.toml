# Only what differs from the ruff defaults. Everything else, including the Python version,
# is inferred from pyproject.toml.
line-length = 100

[lint]
select = ["E", "W", "F", "I", "D", "PL", "TRY", "RUF", "UP", "S", "T10"]
ignore = ["D100", "D200", "D400", "UP007", "TRY003"]

[lint.pydocstyle]
convention = "numpy"

[lint.per-file-ignores]
"tests/*" = ["D103", "S101", "PLR2004"]

[format]
docstring-code-format = true
