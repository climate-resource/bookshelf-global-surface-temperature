# Published warming estimates every book is compared against, in the `assessments` entry.
# `since` must be a baseline in baselines.yaml, and `period` is inclusive of both years.
# An entry with a `dataset` is that dataset's own value, and is compared with it alone.
# AR7 estimates go here alongside AR6, so the comparison grows without a new entry.

assessments:
  - source: IPCC AR6 WGI
    reference: Chapter 2 Executive Summary
    reference_url: https://www.ipcc.ch/report/ar6/wg1/chapter/chapter-2/
    quantity: GMST
    since: "1850-1900"
    period: "1995-2014"
    central: 0.85
    very_likely: [0.69, 0.95]

  - source: IPCC AR6 WGI
    reference: Chapter 2 Executive Summary
    reference_url: https://www.ipcc.ch/report/ar6/wg1/chapter/chapter-2/
    quantity: GMST
    since: "1850-1900"
    period: "2001-2020"
    central: 0.99
    very_likely: [0.84, 1.10]

  - source: IPCC AR6 WGI
    reference: Chapter 2 Executive Summary
    reference_url: https://www.ipcc.ch/report/ar6/wg1/chapter/chapter-2/
    quantity: GMST
    since: "1850-1900"
    period: "2011-2020"
    central: 1.09
    very_likely: [0.95, 1.20]

  # AR6's per-dataset values (Section 2.3.1.1.3), from the dataset versions AR6 used,
  # so later versions are expected to drift.
  - source: IPCC AR6 WGI
    reference: Section 2.3.1.1.3
    reference_url: https://www.ipcc.ch/report/ar6/wg1/chapter/chapter-2/
    quantity: GMST
    dataset: HadCRUT5
    since: "1850-1900"
    period: "1995-2014"
    central: 0.87
    very_likely: [0.81, 0.94]

  - source: IPCC AR6 WGI
    reference: Section 2.3.1.1.3
    reference_url: https://www.ipcc.ch/report/ar6/wg1/chapter/chapter-2/
    quantity: GMST
    dataset: HadCRUT5
    since: "1850-1900"
    period: "2001-2020"
    central: 1.01
    very_likely: [0.94, 1.09]

  - source: IPCC AR6 WGI
    reference: Section 2.3.1.1.3
    reference_url: https://www.ipcc.ch/report/ar6/wg1/chapter/chapter-2/
    quantity: GMST
    dataset: HadCRUT5
    since: "1850-1900"
    period: "2011-2020"
    central: 1.12
    very_likely: [1.06, 1.18]

  # AR6 used NOAAGlobalTemp-Interim, an earlier version than the one in this book.
  - source: IPCC AR6 WGI
    reference: Section 2.3.1.1.3 (NOAAGlobalTemp-Interim)
    reference_url: https://www.ipcc.ch/report/ar6/wg1/chapter/chapter-2/
    quantity: GMST
    dataset: NOAAGlobalTemp
    since: "1850-1900"
    period: "1995-2014"
    central: 0.76

  - source: IPCC AR6 WGI
    reference: Section 2.3.1.1.3 (NOAAGlobalTemp-Interim)
    reference_url: https://www.ipcc.ch/report/ar6/wg1/chapter/chapter-2/
    quantity: GMST
    dataset: NOAAGlobalTemp
    since: "1850-1900"
    period: "2001-2020"
    central: 0.91

  - source: IPCC AR6 WGI
    reference: Section 2.3.1.1.3 (NOAAGlobalTemp-Interim)
    reference_url: https://www.ipcc.ch/report/ar6/wg1/chapter/chapter-2/
    quantity: GMST
    dataset: NOAAGlobalTemp
    since: "1850-1900"
    period: "2011-2020"
    central: 1.02
